<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四則演算シャッフル 100問テスト 生成ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 印刷専用スタイル */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
  .ad-container { display: none !important; } /* 印刷時は広告を非表示にする */
  button { display: none !important; }        /* ボタンも非表示にする */
}

    /* A4 プレビューベース */
    .a4-page {
      width: 210mm;
      height: 297mm;
      padding: 16mm 16mm 12mm 16mm;
      background-color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      margin: 0 auto;
      color: #0f172a;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    /* タイトル */
    .test-title {
      font-size: 16pt;
      font-weight: bold;
      color: #0f172a;
      margin: 0 0 12px 0;
    }

    /* 4列 25行 縦フローグリッド */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(25, 1fr);
      grid-auto-flow: column;
      column-gap: 24px;
      row-gap: 2px;
      flex: 1;
      align-content: stretch;
    }

    /* 1問題あたりの行 */
    .q-row {
      display: flex;
      align-items: center;
      font-size: 10pt;
      padding: 1px 0;
    }

    /* 問題番号 (右揃え固定幅) */
    .q-num {
      width: 38px;
      font-weight: normal;
      color: #475569;
      text-align: right;
      padding-right: 6px;
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* イコール(=)の位置を完璧に整列させるコンテナ */
    .q-expr {
      display: flex;
      align-items: center;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 10.5pt;
      font-weight: normal;
      color: #0f172a;
      flex: 1;
      letter-spacing: 0.5px;
    }

    .q-term1 {
      width: 22px;
      text-align: right;
    }

    .q-op {
      width: 20px;
      text-align: center;
      color: #1e293b;
    }

    .q-term2 {
      width: 22px;
      text-align: right;
    }

    .q-eq {
      width: 20px;
      text-align: center;
      color: #1e293b;
    }

    /* フッター */
    .page-footer {
      flex-shrink: 0;
      margin-top: 4px;
      padding-top: 3mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8pt;
      color: #94a3b8;
    }

    /* 印刷時のスタイル定義 */
    @media print {
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      .a4-page {
        box-shadow: none !important;
        border: none !important;
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 16mm 16mm 12mm 16mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

  <!-- 操作用コントロールバー (印刷時非表示) -->
  <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-800">四則演算100問テスト 生成ツール</h1>
        <p class="text-xs text-slate-5-00 mt-1">A4 1ページ・4列25行・イコール位置完全整列</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- 再生成ボタン -->
        <button id="btn-generate" onclick="generateTest()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition-all duration-150 active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          問題を再作成
        </button>

        <!-- 印刷 / PDF保存ボタン -->
        <button onclick="window.print()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition-all duration-150 active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 002-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          印刷 / PDF保存
        </button>
      </div>
    </div>
  </header>

  <!-- 印刷プレビュー領域 -->
  <main class="max-w-5xl mx-auto px-4 pt-8 flex justify-center overflow-x-auto">
    <div id="print-area" class="a4-page">
      <div>
        <h1 class="test-title">四則演算シャッフル 100問テスト</h1>
      </div>

      <!-- 問題（Javascriptで動的挿入） -->
      <div id="grid-container" class="grid-container"></div>

      <footer class="page-footer">
        <span>四則演算シャッフル 100問テスト</span>
        <span>1 / 1 ページ</span>
      </footer>
    </div>
  </main>

  <script>
    // 乱数ユーティリティ (min 〜 max の整数)
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 問題生成ロジック
    function generateProblem() {
      const types = ['+', '-', '×', '÷'];
      const type = types[getRandomInt(0, 3)];
      let term1, term2;

      switch (type) {
        case '+':
          // 足し算: 1〜2桁 + 1〜2桁
          term1 = getRandomInt(1, 99);
          term2 = getRandomInt(1, 99);
          break;

        case '-':
          // 引き算: 1〜2桁 - 1〜2桁 (結果が正になるように調整)
          term1 = getRandomInt(2, 99);
          term2 = getRandomInt(1, term1 - 1);
          break;

        case '×':
          // 掛け算: 1桁 × 1桁
          term1 = getRandomInt(1, 9);
          term2 = getRandomInt(1, 9);
          break;

        case '÷':
          // 割り算: 2桁 ÷ 1桁 (割り切れる数・答えも1桁〜2桁)
          term2 = getRandomInt(2, 9); // 割り算の除数
          const quotient = getRandomInt(1, 11); // 商
          term1 = term2 * quotient;
          break;
      }

      return { term1, op: type, term2 };
    }

    // 100問を生成してDOMに反映
    function generateTest() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      for (let i = 1; i <= 100; i++) {
        const { term1, op, term2 } = generateProblem();

        const row = document.createElement('div');
        row.className = 'q-row';

        row.innerHTML = `
          <span class="q-num">${i}.</span>
          <span class="q-expr">
            <span class="q-term1">${term1}</span>
            <span class="q-op">${op}</span>
            <span class="q-term2">${term2}</span>
            <span class="q-eq">=</span>
          </span>
        `;

        container.appendChild(row);
      }
    }

    // 初期生成
    window.onload = function() {
      generateTest();
    };
  </script>
</body>
</html>
